version: '3.8'
services:
  database:
    image: postgres:15
    container_name: simapro-db
    environment:
      POSTGRES_DB: simapro_enterprise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simapro-network

  backend:
    build: ./backend
    container_name: simapro-backend
    environment:
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: simapro_enterprise
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: change_me_prod_secret
      CORS_ORIGINS: http://localhost:3000
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 7
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - simapro-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: simapro-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - simapro-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  simapro-network:
    driver: bridge
